version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/sari_db
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - UPLOAD_PATH=./uploads
      - MAX_FILE_SIZE=10485760
      - CORS_ORIGIN=http://localhost:8080
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=sari_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password!23
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sari.com
      - PGADMIN_DEFAULT_PASSWORD=password!23
    ports:
      - "5031:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: 